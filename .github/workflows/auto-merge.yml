name: Auto-fusionar PR validado

# Se dispara cuando termina "Validar Pull Request". A diferencia de
# ese workflow, este SÍ corre con los permisos del repo base (no del
# fork) — por eso puede fusionar PRs. Pero ojo: nunca hace checkout
# del código del fork ni ejecuta nada de él. Solo llama a la API de
# GitHub para revisar la lista de archivos cambiados y, si todo
# calza, fusionar. Además, este workflow SIEMPRE corre con la versión
# que está en main, nunca con la versión que venga dentro del PR —
# así que un PR no puede alterar su propia validación ni la fusión.
on:
  workflow_run:
    workflows: ["Validar Pull Request"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  fusionar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Ubicar el PR asociado a este run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          numero=$(gh api "repos/${{ github.repository }}/commits/$sha/pulls" --jq '.[0].number // empty')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          if [ -z "$numero" ]; then
            echo "No hay un PR abierto para este commit, se omite."
          fi

      - name: Revalidar alcance (defensa en profundidad) y fusionar
        if: steps.pr.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          numero="${{ steps.pr.outputs.numero }}"

          # Segunda verificación, independiente de la del otro workflow:
          # que el PR siga tocando solo uploads/ al momento de fusionar
          # (por si hubo un push nuevo entre medio).
          fuera_de_uploads=$(gh api "repos/${{ github.repository }}/pulls/$numero/files" --paginate \
            --jq '.[].filename' | grep -v '^uploads/' || true)

          if [ -n "$fuera_de_uploads" ]; then
            echo "::error::Revalidación falló, no se fusiona."
            gh pr comment "$numero" --body "❌ La revalidación automática detectó cambios fuera de \`uploads/\` justo antes de fusionar. No se fusionará; corrige y vuelve a intentarlo."
            exit 1
          fi

          gh pr merge "$numero" --squash \
            --subject "Material Extra: fusión automática (validado por Action)"
